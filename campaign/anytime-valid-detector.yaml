# Can a detector DERIVE its own horizon from evidence instead of being handed one --
# and does the horizon it derives track the traffic's measured burstiness?
#
# READ FIRST:
#   campaign/DESIGN-anytime-valid.md                        the design this implements
#   campaign/findings/DETECTION-DELAY-IS-CLIPPED.md          why the speed metric was void
#   campaign/findings/WRAPPER-IS-SCORE-SPECIFIC.md           why the CS target is Peak, not R_t
#   campaign/apparatus/BURSTINESS.md                         the four MEASURED cliffs
#   campaign/LAUNCH-CHECKLIST.md                             what must be true before `nous run`
#
# Pre-flight (BOTH, never one):
#   nous validate campaign campaign/anytime-valid-detector.yaml --smoke
#   nous validate campaign campaign/anytime-valid-detector.yaml --smoke --liveness
kind: optimization
run_id: anytime-valid-detector-e1

# TOP level, unlike optimization.stages -- see the note there.
max_turns:
  plan: 60

# ── LOCKED PARAMETERS: what auto-approve makes load-bearing ───────────────────
# `kind: optimization` AUTO-APPROVES BY DEFAULT (`nous run --help`: "optimization
# campaigns auto-approve by default"), so no human gate will stop a drifting
# apparatus mid-run. locked_parameters is the ONLY one of the three control
# mechanisms the validator re-checks on EVERY BUNDLE, which makes it the
# unattended-run safety precondition the README names (#255/F10, #246/F1).
#
# The guide's decision test -- "would you be upset to discover this was violated
# after 60 runs?" -- with the three-way split it implies:
#   factors             -> yes, AND the campaign should learn its effect
#   locked_parameters   -> yes, and it should simply NEVER change   <-- these
#   design_space.invariants -> yes, and it is a downstream PROPERTY (DS1-DS3)
#
# Every entry below is frozen apparatus from campaign/apparatus/. An apparatus
# change is an epoch boundary, not an edit; three of four prior epochs died from
# an apparatus defect discovered mid-measurement.
locked_parameters:
  # Hardware/model identity. The cliff was measured on exactly this triple.
  model: meta-llama/llama-3.1-8b-instruct
  gpu: H100
  tensor_parallelism: 1
  latency_model: trained-physics

  # The FPR budget the whole comparison is matched at (3.4). If this drifts, no
  # two rows are comparable and the campaign answers nothing.
  target_fpr: 0.05

  # The observation cap. NOT the detector's horizon -- the anytime detector DERIVES
  # that -- but the ceiling at which "never committed" is scored by the
  # indeterminate_forever constraint. Matched to the incumbent's frozen n=6000 so the
  # speed comparison is fair rather than flattering.
  #
  # KEPT AT 6000 DELIBERATELY after Task 2 moved the cliff 20 -> 80-96 rps. The cap is
  # a COUNT of observations, not a duration, so a higher rate reaches it in less
  # simulated time rather than needing a larger count; and holding it at the
  # incumbent's frozen horizon is what keeps the speed comparison honest. If a level
  # cannot commit within 6000 observations that is a REPORTED outcome
  # (indeterminate_forever), not a reason to raise the cap mid-epoch.
  observation_cap: 6000

  # Ladder anchoring. Per-level cliffs live in campaign/apparatus/cliffs.json and
  # are hashed into cliff_table_hash (DS2); these are the multipliers applied to
  # each level's own measured cliff.
  calibration_band: [0.3, 0.4, 0.5, 0.6]
  gray_band: [0.7, 0.8, 0.9, 0.95]
  super_band: [1.1, 1.25, 1.5, 2.0]

  # Seeds. Per-rung verdict is a majority vote over these five (3.5).
  seeds: [42, 43, 44, 45, 46]

  # The burstiness ladder, and the held-out level that must NEVER enter fitting.
  # Recording the held-out name here is what stops a later iteration quietly
  # promoting it into the fit.
  burstiness_levels: [constant, poisson, gamma_cv2, gamma_cv4]
  burstiness_heldout: weibull_cv3

  # Per-level measured cliffs (campaign/apparatus/cliffs.json, hashed as
  # cliff_table_hash / DS2). NOT inherited: LADDER.md's r_nominal=20 belongs to a
  # DIFFERENT workload -- on these specs rate 20 grows only +1.4% (deeply sub) and
  # the poisson knee is at 88. r_nominal describes a (workload, hardware) PAIR.
  # See findings/CLIFF-IS-WORKLOAD-SPECIFIC.md.
  r_nominal_constant: 96
  r_nominal_poisson: 88
  r_nominal_gamma_cv2: 88
  r_nominal_gamma_cv4: 80
  r_nominal_weibull_cv3: 96

  # Scoring rules for the widened verdict alphabet. Pinned because they are
  # PRE-REGISTERED (4): epoch 3 died from a suite change made after launch, and
  # under auto-approve nothing would prompt before a mid-run redefinition.
  rung_fired_threshold: 0.5
  undecided_excluded_from_denominator: true
  min_decided_records: 20
  warmup_frac: 0.1

# ── LOCKED WORKLOAD: auto-approve precondition 2 (#265 / F20) ─────────────────
# The burstiness ladder IS this campaign's canonical workload -- five specs whose
# entire purpose is to be IDENTICAL except for the arrival block, so that any
# measured effect is attributable to burstiness alone. The validator diffs
# bundle.inputs/*.yaml against this; a deliberate deviation must populate
# bundle.workload_changes_from_canonical rather than pass silently.
#
# Declared only NOW, after Task 2: until the cliffs were measured, aggregate_rate
# in each spec was a documented PLACEHOLDER, and pinning it then would have locked
# a number known to be wrong.
#
# NOTE the deliberate asymmetry: the spec FILES are canonical and immutable
# (burstiness_ladder_hash), but a rung driver MUST rewrite aggregate_rate in a
# private COPY -- --rate is inert under --workload-spec
# (findings/RATE-FLAG-IGNORED-UNDER-SPEC.md). Rewriting aggregate_rate in a scratch
# copy is the SANCTIONED deviation; mutating a file under campaign/apparatus/ is not.
locked_workload:
  canonical_specs:
    - campaign/apparatus/burstiness/constant.yaml
    - campaign/apparatus/burstiness/poisson.yaml
    - campaign/apparatus/burstiness/gamma_cv2.yaml
    - campaign/apparatus/burstiness/gamma_cv4.yaml
  held_out_spec: campaign/apparatus/burstiness/weibull_cv3_heldout.yaml
  sanctioned_deviation: >
    aggregate_rate may be rewritten in a per-row COPY under NOUS_RUN_DIR to realize a
    ladder rung (rung_rate = multiplier x r_nominal[level]). Nothing else may differ,
    and no file under campaign/apparatus/ may be modified in place.
  token_distributions_identical: true
  burstiness_ladder_hash: 4f91898a

research_question: >
  Does wrapping a BLIS saturation detector in an anytime-valid confidence sequence let it
  reach a CORRECT saturation verdict in materially fewer observations than the frozen
  n=6000 horizon requires, at a matched 5% false-alarm rate and with every metamorphic
  test still passing -- and does the number of observations it needs grow monotonically
  with the arrival process's measured index of dispersion I = Var(N_T)/E[N_T]?

prompts:
  methodology_layer: prompts/methodology
  domain_adapter_layer: null

# `plan` prices the mechanism and writes mechanism_plan.json; `build` implements it;
# `screen` falsifies the plan's cost_avoided > cost_of_deciding prediction. Declared
# because THE DETECTOR DOES NOT EXIST YET -- unlike saturation-detector-rsm.yaml, whose
# detector was already committed and which therefore correctly declared no build stage.
target_system:
  name: inference-sim
  repo_path: /Users/sri/Documents/Projects/inference-sim/.worktrees/anytime-campaign
  description: >
    BLIS, a deterministic CPU-only discrete-event LLM inference simulator, on branch
    campaign/anytime-valid (based read-only on PR #1620, feat/peak-rate-detector).

    The mechanism to build is a NEW detector at sim/saturation/anytime.go that WRAPS an
    existing detector and decides WHEN the evidence is decisive, rather than answering at
    a horizon someone chose. It implements the existing 4-method Detector interface
    (Name/Observe/Detect/Reset), holds a wrapped Detector, forwards Observe/Reset to it,
    and independently accumulates the same Event stream to maintain (a) an online index of
    dispersion I = Var(N_T)/E[N_T] over arrival timestamps and (b) a confidence sequence
    on its CS target. Absent an `anytime:` config block it must never construct, so
    default output stays byte-identical (INV-6, a tested invariant).

    HARD CONSTRAINT: sim/saturation/peak_rate.go, composite.go and backlog_drift.go must
    end with ZERO lines changed. PR #1620 is under review and its byte-identity tests must
    stay valid. The wrapper composes through the exported Detector interface only.

    The simulator is deterministic: for a fixed seed and fixed knobs it emits
    byte-identical output and reads no wall clock -- simulated time is accumulated from
    trained latency coefficients. That property is what licenses the concurrency block.

    campaign/bench/score_anytime.py runs the metamorphic suite for ONE configuration
    across the burstiness ladder and prints a single JSON object.

optimization:
  # `stages` lives UNDER `optimization:` (stage.py:148 reads
  # campaign["optimization"]["stages"]), while `max_turns` is read at TOP level
  # (stage_runner.py:_plan_max_turns reads campaign["max_turns"]). Two different
  # levels; the guide's snippet shows both unindented together. Both errors were
  # caught by `nous validate campaign`, which is why it runs before --smoke.
  # PLAN AND BUILD ARE DELIBERATELY ABSENT, and this is not an accident.
  #
  # Epoch 1 ran [plan, build, verify, screen, confirm] and failed AFTER both -- 3 of 19
  # screen rows died on an adapter defect (findings/KNOB-GRID note in the bench fix
  # commit). The guide is explicit that relaunching is not the way to recover: "`plan` is
  # not idempotent ... a campaign that fails after `plan` and is simply relaunched spends
  # a second call -- and gets a DIFFERENT design. That is worse than the cost: the
  # campaign then measures a mechanism whose plan nobody read."
  #
  # So the reviewed artifacts are REUSED rather than regenerated:
  #   - mechanism_plan.json (19978 bytes, 4 priced alternatives, 6 failure modes) is
  #     copied to the new work-dir root. `build` reads it from that path regardless of
  #     whether the stage ran, so the reviewed cost model still reaches the prompt as
  #     MECHANISM PLAN and `screen` still falsifies its cost_avoided > cost_of_deciding
  #     prediction.
  #   - `build` is dropped too, because the mechanism it would author ALREADY EXISTS at
  #     sim/saturation/anytime.go (881 lines) + anytime_test.go (1174 lines, 18 tests,
  #     14/14 declared identifiers matched) and has been verified: 3/3 self-check
  #     invariants at all 13 liveness levels, and oracle 2(c) satisfied BY HAND
  #     (probes/verify_control_inert.sh -- byte-identical stdout vs a binary built from
  #     PR #1620's head, on a default run and with each of the four incumbents selected).
  #     Re-running `build` would author a DIFFERENT implementation than the one verified,
  #     which is the same defect as re-running `plan`, one layer down.
  #
  # What this epoch measures is therefore the reviewed plan's mechanism, unchanged, on a
  # repaired adapter. The instrument moved between epochs (that is why this is a new
  # epoch and not an edit); the mechanism did not.
  stages: [verify, screen, confirm]

  run_command: "python3 campaign/bench/score_anytime.py --anytime-config at.yaml --target-fpr 0.05 --adapter-width 2"
  test_command: "go test ./sim/saturation/... -count=1 -json -v -run 'TestAnytime'"
  integrity_command: "go build ./... && golangci-lint run ./sim/saturation/"

  # An INCUMBENT, never the candidate: residual regret is measured against what BLIS
  # ships. composite is the default detector and the strongest incumbent on the response
  # ladders (T2-CORRECTION-INCUMBENTS-NOT-BLIND.md).
  known_valid_baseline: {WRAPPED: composite}

  workload: {seed_env: NOUS_WORKLOAD_SEED}
  policy: {epsilon: {pct: 5.0}, delta_screen: 0.05, delta_terminal: 0.05, confirm_max_rounds: 2}

  response:
    # Observations until the detector COMMITS to a correct verdict. Lower is better. The
    # constraints below are what stop speed being bought with wrongness.
    primary: {metric: obs_to_confident_verdict, direction: minimize}

    constraints:
      # --- inherited guards (GUARDS-CAUGHT-IT.md: a 100%-FPR config scored BEST on
      # regret and was rejected only because these are constraints, not scores) ---
      - {metric: fpr_within_budget_num, op: ">=", value: 1.0}
      - {metric: t1_pass_num, op: ">=", value: 1.0}
      - {metric: fires_on_all_rungs_num, op: "<=", value: 0.0}
      - {metric: knob_at_grid_edge_num, op: "<=", value: 0.0}

      # --- NEW: the always-uncertain analogue of the always-fired trap. A detector that
      # answers INDETERMINATE forever has a perfect FPR and zero flips, and would win a
      # speed objective by never committing. It must DECIDE on every super-capacity rung.
      - {metric: indeterminate_forever_num, op: "<=", value: 0.0}

      # --- NEW: the response-side analogue of knob_at_grid_edge. The defect that voided
      # the previous campaign's headline was a RESPONSE clipped at its endpoint
      # (DETECTION-DELAY-IS-CLIPPED.md), which nothing checked. A metric that saturates
      # cannot rank the things that reach it.
      - {metric: response_interior_num, op: ">=", value: 1.0}

      # --- NEW: a confidence sequence that does not cover is invalid however fast it
      # concludes. Measured on known-stable calibration traffic: the interval must not
      # exclude the healthy value more often than alpha.
      - {metric: cs_coverage_ok_num, op: ">=", value: 1.0}

    # THE TRADE THIS CAMPAIGN EXISTS TO CHARACTERIZE. A single scalar would let a config
    # post an excellent mean while regressing exactly the regime of interest: fast on
    # smooth traffic is worthless if bursty traffic is then called saturated when it is
    # not. Both must hold, in both places.
    regimes:
      - {id: smooth, metric: obs_to_verdict_poisson, op: "<=", value: 3000.0}
      - {id: bursty, metric: correctness_bursty, op: ">=", value: 0.9}

    # Recorded at confirm only, never fitted: a burstiness level never used in fitting.
    # A mechanism tuned to gamma that fails on weibull is a tuned artifact.
    held_out: [obs_to_verdict_weibull_heldout]

    # MEASURED at the baseline corner over 5 seeds, not guessed.
    noise_estimate_pct: 8.0

    self_check:
      # The objective is a predicate over diagnostics, so these assert the row does not
      # contradict itself. A delay of exactly 0 with clipped=false is the arithmetic
      # signature of the bug that voided the last campaign's headline.
      - {metric: calibrated_fpr, op: "<=", value: 1.0}
      - {metric: gamma_within_support_num, op: ">=", value: 1.0}
      - {metric: zero_delay_unclipped_num, op: "<=", value: 0.0}

    # The apparatus identity, constant across every row by construction.
    constant_fields: [model, target_fpr, burstiness_ladder_hash, cliff_table_hash]

  # BLIS's objective is SIMULATED time from trained coefficients. It reads no wall clock,
  # so a co-scheduled neighbour can make a row take longer to FINISH without moving the
  # number it prints. Recorded as the AUTHOR's claim; Nous falsifies it for free -- two
  # rows with identical levels and the same seed reporting different objectives would
  # expose it.
  concurrency:
    load_independent: true

  # 2 adapter workers x max_parallel 3 = 6 BLIS processes on a 10-core box.
  # --adapter-width is a FLAG, not an env-var prefix: run_command is exec'd as argv, so a
  # leading VAR=value is read as the program name. And the adapter must ASSERT the flag's
  # presence rather than os.environ.get(name, default) -- PARALLELISM-OVERSUBSCRIPTION.md
  # is the record of a guard keyed on $NOUS_MAX_PARALLEL, a variable that does not exist,
  # defaulting its divisor to 1 and putting 24 processes at load 122 on 10 cores.
  # nousko exports NOUS_RUN_DIR / ROW_INDEX / RUN_SLOT / WORKLOAD_SEED and nothing else.
  max_parallel: 3

  # The anytime detector STOPS EARLY by design, so a row is cheaper than the fixed-horizon
  # campaign's ~265s. The ceiling is sized for the worst case -- an INDETERMINATE-forever
  # config that runs every rung to the n=6000 cap across four burstiness levels -- because
  # a hung target burns the whole ceiling on every affected row before failing it.
  run_timeout_sec: 3000

  build_checks:
    # Scoped to the new mechanism + its config seam ONLY. Everything else is frozen
    # apparatus a build stage must not be able to touch, and scoping also avoids the
    # whole-tree-hash false positive: BLIS's own test runs leave untracked artifacts that
    # would trip "mechanism drifted since compile" (a false positive in the costume of the
    # worst available true positive). Entries are literal paths, not globs.
    #
    # NOTE the three files deliberately ABSENT: peak_rate.go, composite.go,
    # backlog_drift.go. They are #1620's, they must not change, and leaving them out of
    # the drift oracle's scope is not permission to edit them -- verify's own test run
    # catches that, and the reviewer will.
    mechanism_paths:
      - sim/saturation/anytime.go
      - sim/saturation/anytime_test.go
      - sim/saturation/config.go

  design:
    screen: {resolution: 5, center_points: 3}
    refine: {kind: central_composite, center_points: 3}
    confirm: {replicates: 5, shortlist_size: 3}

  # ── FACTORS ──────────────────────────────────────────────────────────────────
  # CORRECTION (found by `nous validate campaign`): an earlier draft of this file
  # omitted `factors:` entirely, on the theory that declaring them was the author
  # searching the space. The validator rejects that -- `factors` is REQUIRED -- and the
  # code says why it must be: build.py:707 declared_native_tests(factors) reads every
  # factor's relations to learn which native tests the mechanism must satisfy. The build
  # is TOLD the axes and authors a mechanism that honours them; it does not invent them.
  #
  # So the division of labour in LAUNCH-CHECKLIST.md is finer than "nousko picks the
  # factors". Applying its own test -- if the answer needs a MEASUREMENT it is nousko's,
  # if it needs sameness-for-everyone it is mine:
  #   MINE  : which axes exist, which levels are REACHABLE, what each must guarantee
  #           (the relations), that every level runs at all.
  #   NOUSKO: which level WINS, where the optimum sits, whether an axis is dead,
  #           which interactions are consequential -- every one a measurement.
  # Declaring a level is not predicting it. The five axes below are the mechanism's
  # genuinely free choices; the theory fixes none of them.
  factors:
    - id: WRAPPED
      name: wrapped_detector
      type: choice
      # The two #1620 detectors. NOT interchangeable inside the wrapper: composite's
      # score has no built-in drift so its CS target is the mean score, while
      # peak-rate's R_t has a running-max numerator and therefore needs the Peak
      # exponent gamma_t (see factor_nomination fact 3, and
      # findings/WRAPPER-IS-SCORE-SPECIFIC.md). This factor is what answers "does
      # anytime-valid help composite, peak-rate, or both?" rather than assuming one.
      levels: [composite, peak_rate]
      apply: {kind: config_patch, path: at.yaml, pointer: /anytime/wrapped, value: "{level}"}
      manipulation: {observable: "cfg_resolved.wrapped", op: "==", value: "{level}"}
      relations:
        - id: WRAPPED-R1
          kind: correctness
          statement: "the wrapper forwards every observed event to the wrapped detector and never mutates it"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_ForwardsToWrappedUnchanged"
        - id: WRAPPED-R2
          kind: correctness
          statement: "absent an anytime config block the wrapper never constructs and output is byte-identical"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_AbsentBlockIsByteIdentical"
        - id: WRAPPED-R3
          kind: behavioral
          statement: "the CS target is the wrapped detector's own statistic family, not a shared one"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_TargetIsPerWrappedDetector"

    - id: BOUND
      name: bound_family
      type: choice
      # The theory does not pick one. A Howard-style self-normalized empirical-Bernstein
      # bound and a mixture-SPRT are both anytime-valid; they trade width at small n
      # against width at large n differently, and which trade wins HERE is exactly a
      # measurement. gamma_t's [0,1] support (fact 3) is what makes the
      # empirical-Bernstein form applicable at all.
      levels: [howard_eb, mixture_sprt]
      apply: {kind: config_patch, path: at.yaml, pointer: /anytime/bound, value: "{level}"}
      manipulation: {observable: "cfg_resolved.bound", op: "==", value: "{level}"}
      relations:
        - id: BOUND-R1
          kind: correctness
          statement: "the interval is non-empty, finite, and its lower bound never exceeds its upper at any n"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_IntervalWellFormedAtEveryN"
        - id: BOUND-R2
          kind: correctness
          statement: "the interval is clipped to the statistic's declared support and never reports a value outside it"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_IntervalRespectsSupport"
        - id: BOUND-R3
          kind: behavioral
          statement: "the interval width is non-increasing in the number of observations, all else equal"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_WidthShrinksWithObservations"

    - id: ALPHA
      name: confidence_level
      type: numeric
      # The error budget the SEQUENCE spends across all peeks -- not a per-look alpha.
      # Tighter alpha buys fewer false commitments and costs observations; the exchange
      # rate on this apparatus is a measurement.
      levels: [0.01, 0.05, 0.10]
      grid: 0.01
      apply: {kind: config_patch, path: at.yaml, pointer: /anytime/alpha, value: "{level}"}
      manipulation: {observable: "cfg_resolved.alpha", op: "==", value: "{level}"}
      relations:
        - id: ALPHA-R1
          kind: correctness
          statement: "on known-stable traffic the sequence excludes the healthy value no more often than alpha"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_CoverageHoldsUnderAlpha"
        - id: ALPHA-R2
          kind: behavioral
          statement: "a smaller alpha never yields an earlier commitment on the same event stream"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_SmallerAlphaNeverCommitsEarlier"

    - id: DISPWIN
      name: dispersion_window_us
      type: numeric
      # The trailing window over which I = Var(N_T)/E[N_T] is estimated. This is the
      # BURSTINESS-SENSING knob and the campaign's central claim runs through it: too
      # short and I is noise, too long and a burst is averaged away. Its levels span
      # sub-second to ~10s so the screen can find the scale, since the right window
      # depends on the burst timescale, which is a property of the traffic and therefore
      # measured, never declared.
      levels: [500000, 2000000, 5000000, 10000000]
      grid: 500000
      apply: {kind: config_patch, path: at.yaml, pointer: /anytime/dispersion_window_us, value: "{level}"}
      manipulation: {observable: "cfg_resolved.dispersion_window_us", op: "==", value: "{level}"}
      relations:
        - id: DISPWIN-R1
          kind: correctness
          statement: "the dispersion estimate is >= 0 and equals ~1 on Poisson arrivals"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_DispersionIsOneOnPoisson"
        - id: DISPWIN-R2
          kind: behavioral
          statement: "the dispersion estimate is larger on bursty arrivals than on Poisson at the same mean rate"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_DispersionRisesWithBurstiness"
        - id: DISPWIN-R3
          kind: behavioral
          statement: "a larger dispersion estimate widens the interval at equal observation count"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_HigherDispersionWidensInterval"

    - id: INDET
      name: indeterminate_policy
      type: choice
      # What the detector does while the interval straddles the threshold. `strict`
      # withholds any verdict until the interval clears one side; `lean_stable` reports
      # STABLE while undecided (safer for alarm fatigue, slower to fire). Both are
      # defensible operationally, so which one the objective prefers is a measurement --
      # and the indeterminate_forever constraint stops `strict` from winning by never
      # committing at all.
      levels: [strict, lean_stable]
      apply: {kind: config_patch, path: at.yaml, pointer: /anytime/indeterminate_policy, value: "{level}"}
      manipulation: {observable: "cfg_resolved.indeterminate_policy", op: "==", value: "{level}"}
      relations:
        - id: INDET-R1
          kind: correctness
          statement: "an undecided record is excluded from the fired-fraction denominator, never counted as stable"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_UndecidedExcludedFromDenominator"
        - id: INDET-R2
          kind: correctness
          statement: "fired -> undecided -> fired is not counted as a temporal flip but fired -> stable -> fired is"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_FlipCountIgnoresUndecided"
        - id: INDET-R3
          kind: correctness
          statement: "undecidedness never widens the shared Level enum and an anytime report decodes without becoming STABLE"
          native_test: "sim/saturation/anytime_test.go::TestAnytime_ReportRoundTripsWithoutLevelWidening"

  design_space:
    invariants:
      # FPR calibration is measured per row on the calibration band and frozen before any
      # ladder is read (§3.4). A campaign that searched the threshold jointly with the
      # mechanism would be tuning sensitivity with knowledge of the answers.
      - id: DS1
        statement: "the per-row threshold is calibrated to the declared target FPR, never set by a factor level"
        observable: "threshold_was_calibrated"
        op: "=="
        value: true

      # The burstiness ladder is frozen apparatus. Each level's cliff was MEASURED (a
      # ladder that never tips makes its tests vacuous; a base rung that already tips
      # makes them unfalsifiable). A row reporting a different ladder is not comparable to
      # its neighbours.
      - id: DS2
        statement: "every row uses the frozen burstiness ladder with its four measured per-level cliffs"
        observable: "cliff_table_hash"
        op: "=="
        value: "baseline"

      # The three #1620 detector files are byte-identical to the PR head. This is the
      # isolation constraint made machine-checkable rather than merely stated.
      - id: DS3
        statement: "the three incumbent detector files are unmodified from the PR #1620 head"
        observable: "incumbent_files_unmodified"
        op: "=="
        value: true

  guidance:
    # PASSED VERBATIM INTO THE BUILD PROMPT as "AUTHOR'S GUIDANCE ON THE MECHANISM".
    # This and target_system.description are the ONLY prose that reaches the build agent.
    # The guide records a field test where an author's known-crash-mode note sat in a
    # field nothing read, the build shipped the exact defect already diagnosed, and a
    # two-arm comparison was confounded 10x. Everything the builder must know is here.
    factor_nomination: >
      WHAT TO BUILD. One new file sim/saturation/anytime.go (plus anytime_test.go) and an
      `anytime:` block wired into sim/saturation/config.go following the EXISTING pattern
      there: add the block struct, a resolver, a registry case, and an entry in the
      blockOwners() table -- that table is the single source of truth both ownership
      checks derive from, and a detector with a block but no blockOwners entry gets its
      block SILENTLY DROPPED by the bank path (the exact drift #1620 fixed).

      SIX FACTS THE MECHANISM DEPENDS ON. Each is verified in the target; missing any one
      produces a wrong mechanism.

      (1) ZERO LINES may change in sim/saturation/peak_rate.go, composite.go or
      backlog_drift.go. PR #1620 is under review and its byte-identity tests must stay
      valid. Compose through the exported Detector interface (Name/Observe/Detect/Reset)
      and construct the wrapped detector through the existing registry by name.

      (2) Result.Signals is an OUTPUT surface, not an input. It serializes into
      --saturation-report, so an unconditional new key is a report-format change even when
      every verdict is unchanged (commit 3a61aa3b). Do NOT read peak_backlog or
      elapsed_sec back out of the wrapped detector's Signals map. Track in-flight, the
      running peak, and elapsed time in the WRAPPER from the Event stream: Event carries
      Timestamp, Type (Arrival/Completion), RequestID, LatencyMs, InputTokens,
      OutputTokens. Arrival increments in-flight, Completion decrements it (guard against
      going negative -- a completion without its arrival must not drive the backlog below
      zero), and the peak is the running maximum.

      (3) THE CS TARGET IS SCORE-SPECIFIC AND IS NOT A FREE CHOICE. peak-rate's statistic
      R_t = Peak_t/t has a RUNNING-MAX numerator (peak_rate.go:219), so its expectation
      drifts downward by construction even at constant load; a confidence sequence over
      raw R_t narrows around a moving target, which is a confident WRONG answer -- the
      exact failure an anytime-valid method is adopted to prevent. Use the Peak growth
      exponent gamma_t = d log Peak_t / d log t. It is bounded in [0,1] by construction
      (Peak is non-decreasing so >= 0; in-flight cannot outgrow arrivals so <= 1), which
      is where empirical-Bernstein / Howard-style bounds are tightest and where the
      interval can be clipped to its support for free. Regimes: gamma ~ 1 overloaded,
      ~ 0.5 critical (Peak ~ sqrt(t)), ~ 0 healthy. Fire when the interval lies wholly
      ABOVE 0.5. gamma_t < 0 is IMPOSSIBLE, so an interval below zero is a bug indicator
      rather than a verdict -- assert it, never clamp silently. NOTE the effective sample
      size: Peak_t only moves when a NEW MAXIMUM is set, so the CS width must be driven by
      the count of record-setting events, not the record count. composite's score has no
      built-in drift, so for it the CS target is the mean score against its
      sensitivity-scaled noise floor.

      (4) INDETERMINATE MUST NOT BECOME A FOURTH `Level` VALUE. Level has three values and
      Level.UnmarshalJSON maps every unrecognized string to Stable "for unknown values"
      (detector.go:69), so a fourth enum value makes an older reader decode
      "INDETERMINATE" as STABLE -- a silently wrong verdict, not a parse error. reduce.go
      also indexes its counts array by Level and scans Overloaded -> Stable for the
      severity tie-break, asserting Level >= Stable && Level <= Overloaded. Carry
      undecidedness OUT OF BAND on the wrapper's own surface so --saturation-report stays
      decodable by every existing reader and ReduceAll's ordering is untouched. Pin it
      with a round-trip test: an anytime report decoded by the existing UnmarshalJSON must
      never silently become STABLE.

      (5) THE VERDICT ALPHABET'S SCORING RULES ARE PRE-REGISTERED and must be implemented
      as stated, not re-derived: a rung is FIRED iff fired >= 50% of DECIDED records, with
      undecided records EXCLUDED from the denominator rather than counted stable, plus a
      minimum-decided floor so "one decided record, it fired" cannot pass; and
      fired -> undecided -> fired is NOT a T4 flip (honest uncertainty) while
      fired -> STABLE -> fired IS.

      (6) Every level must be reachable through --saturation-config's `anytime:` block
      alone, with no rebuild between rows, and the detector must be constructible from the
      registry by name.

      THE BAR YOU MUST CLEAR, MEASURED. The incumbents were scored through this exact
      adapter, at a matched 5% FPR, on identical traffic (5 seeds x 13 rungs x 5 burstiness
      levels). Observations-to-confident-verdict on Poisson, lower is better:

        peak-rate       21    knob 16.0   FPR 0.05   correctness_bursty 0.875
        composite       63    knob  8.0   FPR 0.00   correctness_bursty 1.000
        threshold      927    knob 2500   FPR 0.00   correctness_bursty 0.500
        backlog-drift  never fires (grid edge -- would be REJECTED by knob_at_grid_edge)

      So the mechanism must commit in FEWER than ~21 observations on smooth traffic while
      keeping correctness on bursty traffic at or above 0.9 -- note peak-rate is FAST but
      only 0.875 correct on bursty, and composite is CORRECT but 3x slower. **That gap is
      the opening**: an anytime-valid wrapper should be able to take composite's
      correctness at nearer peak-rate's speed, because it stops as soon as the evidence is
      decisive instead of at a fixed horizon. If your design cannot beat 21 while holding
      0.9 correctness, say so in the plan's cost model rather than shipping a mechanism that
      cannot clear the bar.

      THE BURSTINESS SIGNAL IS REAL AND MEASURED, so build the width to USE it. The
      dispersion index over the five levels, measured through this adapter (window 2s):

        constant 0.002 | poisson 1.08 | gamma_cv2 2.08 | weibull_cv3 8.49 | gamma_cv4 9.40

      Poisson measuring ~1.0 is the estimator's own calibration check (I = 1 for a Poisson
      process by definition), so the estimator is trustworthy. A CS width that scales like
      sqrt(I log log n / n) therefore has a genuine 4000x span of I to work with between the
      smoothest and burstiest rungs. NOTE that capacity is NOT monotone in the CV knob
      across arrival FAMILIES (weibull CV=3 has the same cliff as constant), but the
      MEASURED I is monotone -- so drive the width from the measured I, never from a
      declared CV or a per-level constant.

      WHAT IS FROZEN APPARATUS AND MUST NOT BE TOUCHED: the burstiness ladder specs and
      the measured cliff table under campaign/apparatus/, the bench adapter
      campaign/bench/score_anytime.py, the workload generator, and the three incumbent
      detector files. They are outside mechanism_paths for that reason.

      KNOWN-DEAD AXES, so they are refuted explicitly rather than omitted silently:
      excursion_scaling and idle_fraction were screened and proved provably constant on
      this apparatus -- in-flight NEVER returns to zero under continuous batching because
      E2E >> inter-arrival gap, so the reflecting boundary is never visited and there is
      exactly 1 excursion and 0 idle time even at 1 rps. Do not nominate a factor whose
      signal is excursion counting or idle fraction.

    # RESERVED AND READ BY NO STAGE. Deliberately NOT passed to build: it steers how
    # RESULTS are read, and build makes no correctness judgement (verify is the gate), so
    # handing it these rules would invite it to pre-judge a measurement it may not make.
    interpretation: >
      The incumbents (composite, peak-rate, threshold, backlog-drift) are scored by the
      same adapter and are REFERENCE POINTS, not rows in this design. The bar is
      detection_strategies.md 3b: merely matching the level/symptom detectors is not
      enough to justify a new mechanism. Report honestly if an incumbent wins.

      Two prior claims in this work are RETRACTED and must not be cited as baselines: the
      "0.0 ms detection-delay tie" between randomwalk and composite (the metric was
      clipped at its origin -- see DETECTION-DELAY-IS-CLIPPED.md; on unclipped evidence
      composite fires ~7x earlier), and "the incumbents are blind to T2-IN" (measured on a
      hand-built stream that held service time fixed while scaling prompts 32x). Four
      false conclusions in this work came from author-built measurements that could not
      fail in the direction being tested; treat any synthetic-stream result as an ABLATION
      within one statistic, never as a cross-detector claim.

      If the speed win on smooth traffic turns out to be small because the incumbent
      already decides within the first few events, that is a legitimate reported outcome:
      the mechanism's value then rests on the BURSTY regime -- correctness where a fixed
      horizon over-fires -- which is a narrower claim than "faster" and must be reported
      as such rather than reframed.

      If a configuration reaches confidence in NO MORE observations on gamma CV=4 than on
      Poisson at the same mean rate, the campaign's central prediction is REFUTED. Report
      that, do not rescue it.
